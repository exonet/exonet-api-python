---
name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    name: Lint and validate code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv only publishes full version tags
        with:
          version-file: .github/workflows/requirements.txt
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff linter
        run: uv run ruff check --output-format=github .

      - name: Run Ruff formatter
        run: uv run ruff format --check .

      - name: Run bandit
        run: uv run bandit -r exonetapi

  test:
    name: Run tests on python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv only publishes full version tags
        with:
          version-file: .github/workflows/requirements.txt
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest --cov exonetapi

  test-lowest:
    name: Run tests with the lowest supported dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv only publishes full version tags
        with:
          version-file: .github/workflows/requirements.txt
          python-version: '3.11'
          enable-cache: true

      - name: Run pytest
        run: uv run --isolated --resolution lowest-direct pytest

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv only publishes full version tags
        with:
          version-file: .github/workflows/requirements.txt

      - name: Build package
        run: uv build
