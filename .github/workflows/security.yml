---
name: Security

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check-licenses:
    name: Check licenses for dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv only publishes full version tags
        with:
          version-file: .github/workflows/requirements.txt
          python-version: '3.11'
          enable-cache: true

      # Only the dependencies that ship with exonetapi, not the dev tools.
      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Check licenses
        run: uv run --no-dev python .github/scripts/check_licenses.py
