---
name: Publish

on:
  release:
    types: [released]

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv only publishes full version tags
        with:
          version-file: .github/workflows/requirements.txt

      # The release tag is the version, so pyproject.toml needs no bump per release.
      - name: Set the version from the release tag
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: uv version "$VERSION" --frozen

      - name: Build package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # A separate job, so only the upload step can request the PyPI token.
  publish:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/exonetapi/
    permissions:
      # PyPI trusted publishing exchanges this OIDC token for an upload token.
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
