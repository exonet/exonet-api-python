---
name: Publish

on:
  release:
    types: [released]

jobs:
  publish:
    name: Build & publish package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/exonetapi/
    permissions:
      # PyPI trusted publishing exchanges this OIDC token for an upload token.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0  # setup-uv only publishes full version tags
        with:
          version-file: .github/workflows/requirements.txt

      - name: Build package
        run: uv build

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
